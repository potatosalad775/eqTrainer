name: Build App

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: 3.47.2

      - name: Get Keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Create key properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > android/key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties

      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get
          
      - name: Build APK
        run: |
          flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: build-android
          path: build/app/outputs/bundle/release/*

  build-iOS:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: 3.47.2

      - name: Setup Podfile
        run: |
          cd ios
          flutter clean
          flutter pub get
          pod install
          cd ..

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload
          zip -r -y Payload.zip Payload/Runner.app
          mv Payload.zip build/ios/Payload.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: build-iOS
          path: build/ios/Payload.ipa

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: 3.47.2

      - name: Build Windows
        run: |
          flutter clean
          flutter build windows --release

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: build-windows
          path: build/windows/x64/runner/Release/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: 3.47.2

      # macOS has no CocoaPods integration any more — every plugin it uses is a
      # Swift Package, which "flutter build" resolves on its own.
      - name: Prepare
        run: |
          flutter clean
          flutter pub get

      - name: Build macOS
        run: |
          flutter build macos --release

      - name: Create DMG
        run: |
          brew install create-dmg
          cd build/macos/Build/Products/Release
          create-dmg \
            --volname "eq_trainer" \
            --window-pos 200 120 \
            --window-size 800 529 \
            --icon-size 130 \
            --text-size 14 \
            --icon "eq_trainer.app" 260 250 \
            --hide-extension "eq_trainer.app" \
            --app-drop-link 540 250 \
            --hdiutil-quiet \
            "eq_trainer.dmg" \
            "eq_trainer.app"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: build-macOS
          path: build/macos/Build/Products/Release/eq_trainer.dmg

  build-linux:
    runs-on: ubuntu-latest
  
    steps:
      - uses: actions/checkout@v7
  
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: 3.47.2

      # libasound2-dev is for flutter_soloud: its build hook compiles the
      # SoLoud ALSA backend (-DWITH_ALSA) and links -lasound, so the headers
      # have to be on the runner. The gstreamer -dev packages are what
      # audio_decoder's Linux plugin builds against.
      - name: Update system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake git ninja-build \
          pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
          libasound2-dev \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
  
      - name: Enable flutter_distributor
        run: |
          dart pub global activate flutter_distributor
          
      - name: Build Deb
        run: |
          $HOME/.pub-cache/bin/flutter_distributor release --name=release --jobs=release-linux-deb
  
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: build-linux
          path: dist/*
