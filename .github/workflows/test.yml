name: Test

on:
  # `push` covers every branch in this repo, so `pull_request` only needs to
  # fire for the events a push does *not* already cover — opening a PR (or a
  # fork's PR, where no push event reaches this repo) and taking one out of
  # draft. Listing `pull_request` without `types` would double every run: one
  # for the branch push, one for the same commit as a PR.
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'appcast.xml'
      - 'LICENSE'
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

# Superseded runs are pointless: a second push to the same branch cancels the
# first one's jobs instead of queueing behind them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests — headless, no device required, fastest feedback.
  #
  # This is the whole of CI's test coverage on purpose. The integration
  # suites under integration_test/ drive a real SoLoud engine against a real
  # output device, and a hosted runner has no audio hardware — what they
  # would verify there is not the environment any user runs in. They are run
  # locally on real devices instead; see AGENTS.md > Testing.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      # flutter_soloud ships a native build hook (hook/build.dart), so even a
      # pure-Dart `flutter test` compiles its C sources. On Linux that build
      # passes -DWITH_ALSA and includes <alsa/asoundlib.h>, which the runner
      # image does not carry.
      - name: Install ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libasound2-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test test/ --reporter=github
