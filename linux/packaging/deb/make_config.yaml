display_name: eqTrainer
package_name: eq-trainer
maintainer:
  name: potatosalad775
  email: transaction@kakao.com
priority: optional
section: x11
installed_size: 6604

# Runtime libraries the bundle needs: GTK 3, which Flutter's Linux embedder links
# against, and ALSA for flutter_soloud, whose miniaudio backend opens it with
# dlopen and tries it first. (mpv was a leftover from the old media_kit engine and
# is no longer used.)
dependencies:
  - libgtk-3-0t64 | libgtk-3-0
  - libasound2t64 | libasound2

# flutter_soloud opens FFmpeg with dlopen to read M4A, AAC, AIFF and WMA. A
# recommendation rather than a dependency: WAV, MP3, FLAC and Ogg need nothing,
# and without it the other formats are refused with a message.
recommended_dependencies:
  - ffmpeg

essential: false
icon: linux/assets/app_icon.png

postinstall_scripts:
  - echo "Installed my awesome app"
postuninstall_scripts:
  - echo "Surprised Pickachu face"

keywords:
  - eq
  - eqTrainer

generic_name: Music Application

categories:
  - Music
  - Media

startup_notify: true

# You can also specify [metainfo](https://freedesktop.org/software/appstream/docs/chap-Quickstart.html) file
# which contains metadata of the app.
# metainfo: linux/packaging/myappid.appdata.xml