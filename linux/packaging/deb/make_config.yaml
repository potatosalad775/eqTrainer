# Runtime libraries the bundle links against: ALSA for flutter_soloud's
# SoLoud backend, GStreamer for audio_decoder's Linux plugin. (mpv was a
# leftover from the old media_kit engine and is no longer used.)
dependencies:
  - libasound2t64 | libasound2
  - libgstreamer1.0-0
  - libgstreamer-plugins-base1.0-0
  - gstreamer1.0-plugins-good
  - gstreamer1.0-plugins-bad

essential: false
icon: linux/assets/app_icon.png

postinstall_scripts:
  - echo "Installed my awesome app"
postuninstall_scripts:
  - echo "Surprised Pickachu face"

keywords:
  - eq
  - eqTrainer

generic_name: Music Application

categories:
  - Music
  - Media

startup_notify: true

