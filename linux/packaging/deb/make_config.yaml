priority: optional
section: x11
installed_size: 6604

# Runtime libraries the bundle needs: ALSA for flutter_soloud, whose miniaudio
# backend opens it with dlopen and tries it first, GStreamer for audio_decoder's
# Linux plugin. (mpv was a leftover from the old media_kit engine and is no
# longer used.)
dependencies:
  - libasound2t64 | libasound2
  - libgstreamer1.0-0
  - libgstreamer-plugins-base1.0-0
  - gstreamer1.0-plugins-good
  - gstreamer1.0-plugins-bad

# flutter_soloud opens FFmpeg with dlopen to read M4A, AAC, AIFF and WMA. A
# recommendation rather than a dependency: WAV, MP3, FLAC and Ogg need nothing,
# and without it the other formats are refused with a message.
recommended_dependencies:
  - ffmpeg

essential: false
icon: linux/assets/app_icon.png

postinstall_scripts:
  - echo "Installed my awesome app"
postuninstall_scripts:
  - echo "Surprised Pickachu face"

keywords:
  - eq
  - eqTrainer

generic_name: Music Application

categories:
  - Music
  - Media

startup_notify: true

# You can also specify [metainfo](https://freedesktop.org/software/appstream/docs/chap-Quickstart.html) file
