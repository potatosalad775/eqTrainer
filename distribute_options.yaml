output: dist/

releases:
  - name: release
    jobs:
      - name: release-linux-deb
        package:
          platform: linux
          target: deb
      - name: release-linux-rpm
        package:
          platform: linux
          target: rpm

# Run (both jobs; `rpm` must be on PATH for the rpm job)
# fastforge release --name=release
# ...or one at a time:
# fastforge release --name=release --jobs=release-linux-deb
# fastforge release --name=release --jobs=release-linux-rpm